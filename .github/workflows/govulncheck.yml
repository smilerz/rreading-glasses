name: govulncheck

# Reports known vulnerabilities that this code actually calls (reachability based, so low noise).
on:
  pull_request:
    branches: [integration]
  schedule:
    - cron: '0 14 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
