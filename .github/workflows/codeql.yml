name: Code scanning

# CodeQL baseline on the default branch, on pull requests, and weekly (same shape as smilerz/recipes).
on:
  push:
    branches: [integration]
  pull_request:
    branches: [integration]
  schedule:
    - cron: '0 13 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: go

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          category: "/language:go"
