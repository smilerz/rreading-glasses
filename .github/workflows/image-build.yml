name: Image build

# Pull request gate: the container must build before a change can merge. Nothing is pushed here;
# publishing happens in publish.yml after the merge.
on:
  pull_request:
    branches: [integration]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-build:
    name: Image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          build-args: RGPATH=./cmd/rghc
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
