# Dependency updates, following the conventions of smilerz/recipes: grouped minor/patch updates, a cooldown so a
# freshly published release is not adopted the day it appears, a `chore` commit prefix, and labels.
# Major versions stay ungrouped so each gets its own pull request and CI run.
# (Upstream also ships renovate.json; it is left untouched to keep merges from upstream conflict-free, and no
# Renovate app is installed on this fork.)
version: 2

updates:
  - package-ecosystem: "gomod"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    directory: "/"
    groups:
      go-patches:
        update-types: ["patch"]
      go-minors:
        update-types: ["minor"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "go"
      - "dependencies"

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    directory: "/"
    groups:
      actions-updates:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "github_actions"
      - "dependencies"

  - package-ecosystem: "docker"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "docker"
      - "dependencies"
